name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install -U pip ruff

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # setuptools-scm derives the version from git history, so a shallow
      # clone would produce a wrong version and mask tag-related problems.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      # Hardware tests are excluded by the default `addopts` in pyproject.toml.
      # Everything else -- unit, daemon, integration, interface -- runs against
      # simulated drivers and must pass here.
      - name: Run tests
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[docs]"

      # -W turns Sphinx warnings into errors: a broken cross-reference or a
      # document missing from a toctree fails the build rather than rotting.
      - name: Build docs
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html

      - name: Check external links
        continue-on-error: true
        run: python -m sphinx -b linkcheck docs/source docs/build/linkcheck

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build twine
          python -m build

      - name: Check metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
